<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bora hablar! — Practicar español</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --ink:#15161b;
    --ink-soft:#6c6e78;
    --ink-faint:#a6a8b2;
    --line:#15161b;
    --line-soft:#e6e6ea;
    --success:#178a4c;
    --success-soft:#eaf9f0;
    --success-line:#178a4c;
    --error:#c62839;
    --error-soft:#fdedef;
    --error-line:#c62839;
    --paper:#fbfbfa;
    --radius-lg:22px;
    --radius-md:14px;
    --radius-sm:9px;
    --font-display:'Baloo 2', system-ui, sans-serif;
    --font-body:'Work Sans', system-ui, sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:28px 20px 60px;
  }

  /* ---------- Header ---------- */
  header.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    margin-bottom:22px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .brand-mark{
    width:46px;height:46px;
    border-radius:50%;
    border:2px solid var(--line);
    overflow:hidden;
    flex:none;
    display:flex;align-items:center;justify-content:center;
    background:var(--paper);
  }
  .brand-mark img{width:135%;height:135%;object-fit:contain;object-position:center 15%;}
  .brand-name{
    font-family:var(--font-display);
    font-weight:800;
    font-size:26px;
    letter-spacing:-0.01em;
    line-height:1;
    position:relative;
  }
  .brand-name .squiggle{
    display:block;
    margin-top:3px;
  }
  .eyebrow-global{
    font-family:var(--font-mono);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.09em;
    color:var(--ink-soft);
    text-align:right;
  }

  /* ---------- Tabs ---------- */
  .tabs{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:8px;
    margin-bottom:18px;
  }
  .tab-btn{
    font-family:var(--font-display);
    font-weight:700;
    font-size:14px;
    padding:11px 6px;
    border-radius:999px;
    border:1.6px solid var(--line);
    background:var(--bg);
    color:var(--ink);
    cursor:pointer;
    transition:background .15s ease, color .15s ease, transform .1s ease;
    letter-spacing:0.01em;
  }
  .tab-btn:active{transform:scale(0.98);}
  .tab-btn.active{
    background:var(--ink);
    color:#fff;
  }

  /* ---------- Card (ruled paper) ---------- */
  .card{
    background:var(--paper);
    border:1.6px solid var(--line);
    border-radius:var(--radius-lg);
    padding:26px 22px 22px;
    position:relative;
    overflow:hidden;
  }
  .card::before{
    /* faint ruled-notebook lines in the background */
    content:"";
    position:absolute;
    inset:0;
    background-image:repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 33px,
      var(--line-soft) 33px,
      var(--line-soft) 34px
    );
    opacity:.55;
    pointer-events:none;
  }
  .card-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:relative;
    z-index:1;
    margin-bottom:16px;
  }
  .eyebrow{
    font-family:var(--font-mono);
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--ink-soft);
  }
  .hint-text{
    text-align:center;
    font-size:12.5px;
    color:var(--ink-faint);
    position:relative;z-index:1;
    margin:2px 0 14px;
  }

  /* ---------- Phrase display ---------- */
  .prompt-block{
    position:relative;
    z-index:1;
    text-align:center;
    padding:6px 0 18px;
  }
  .prompt-es{
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(22px,5.6vw,30px);
    line-height:1.25;
    letter-spacing:-0.01em;
  }
  .prompt-pt{
    font-family:var(--font-body);
    font-style:italic;
    font-size:14.5px;
    color:var(--ink-soft);
    margin-top:8px;
  }

  /* ---------- Mascot + action row (Leer) ---------- */
  .stage{
    position:relative;
    z-index:1;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:22px;
    margin:6px 0 14px;
  }
  .mascot-box{
    width:118px;
    flex:none;
    display:flex;
    align-items:flex-end;
    justify-content:center;
  }
  .mascot-box img{
    width:100%;
    height:auto;
    display:block;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,.08));
    transition:transform .25s ease;
  }
  .mascot-box.pop img{ animation:pop .38s ease; }
  @keyframes pop{
    0%{transform:scale(1);}
    35%{transform:scale(1.08) rotate(-2deg);}
    100%{transform:scale(1);}
  }

  .options-col{
    display:flex;
    flex-direction:column;
    gap:10px;
    position:relative;z-index:1;
    margin-top:2px;
  }
  .option-btn{
    display:flex;
    align-items:center;
    gap:11px;
    width:100%;
    font-family:var(--font-body);
    font-weight:600;
    font-size:16px;
    padding:13px 16px;
    border-radius:var(--radius-md);
    border:1.6px solid var(--line);
    background:#fff;
    color:var(--ink);
    cursor:pointer;
    text-align:left;
    transition:background .15s ease, border-color .15s ease, color .15s ease, transform .1s ease, opacity .15s ease;
  }
  .option-btn:active{transform:scale(0.99);}
  .option-letter{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--ink-faint);
    border:1.3px solid var(--line-soft);
    border-radius:50%;
    width:22px;height:22px;
    display:flex;align-items:center;justify-content:center;
    flex:none;
  }
  .option-btn.correct{background:var(--success-soft); border-color:var(--success-line); color:var(--success);}
  .option-btn.correct .option-letter{border-color:var(--success-line); color:var(--success);}
  .option-btn.wrong{background:var(--error-soft); border-color:var(--error-line); color:var(--error);}
  .option-btn.wrong .option-letter{border-color:var(--error-line); color:var(--error);}
  .option-btn[disabled]{cursor:default;}
  .option-btn[disabled]:not(.correct):not(.wrong){opacity:.5;}
  .blank{
    display:inline-block;
    min-width:72px;
    border-bottom:2.6px solid var(--ink);
    vertical-align:-2px;
    margin:0 1px;
  }

  /* ---------- Feedback area ---------- */
  .feedback{
    position:relative;z-index:1;
    margin-top:14px;
    border-radius:var(--radius-md);
    border:1.4px solid var(--line-soft);
    background:#fff;
    padding:14px 16px;
    display:none;
  }
  .feedback.show{display:block;}
  .feedback.ok{border-color:var(--success-line); background:var(--success-soft);}
  .feedback.no{border-color:var(--error-line); background:var(--error-soft);}
  .fb-head{
    display:flex;align-items:center;gap:8px;
    font-family:var(--font-display);
    font-weight:700;
    font-size:15px;
    margin-bottom:6px;
  }
  .fb-head.ok-c{color:var(--success);}
  .fb-head.no-c{color:var(--error);}
  .fb-mark{width:20px;height:20px;flex:none;}
  .fb-note{font-size:13px;color:var(--ink-soft);margin-top:6px;font-style:italic;}

  /* ---------- Escribir controls ---------- */
  .toggle-row{
    display:flex;
    justify-content:center;
    margin-bottom:16px;
    position:relative;z-index:1;
  }
  .toggle-pill{
    display:inline-flex;
    border:1.4px solid var(--line);
    border-radius:999px;
    padding:3px;
    gap:2px;
  }
  .toggle-pill button{
    font-family:var(--font-body);
    font-weight:600;
    font-size:13px;
    padding:6px 16px;
    border-radius:999px;
    border:none;
    background:transparent;
    color:var(--ink);
    cursor:pointer;
  }
  .toggle-pill button.active{
    background:var(--ink);
    color:#fff;
  }

  .audio-row{
    display:flex;
    justify-content:center;
    gap:16px;
    margin:8px 0 20px;
    position:relative;z-index:1;
  }
  .audio-btn{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    background:none;
    border:none;
    cursor:pointer;
    color:var(--ink);
  }
  .audio-circle{
    width:64px;height:64px;
    border-radius:50%;
    border:1.8px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    background:var(--bg);
    transition:background .15s ease, transform .1s ease;
  }
  .audio-btn:active .audio-circle{transform:scale(0.96);}
  .audio-circle.playing{background:var(--ink);}
  .audio-circle.playing svg path, .audio-circle.playing svg circle, .audio-circle.playing svg ellipse{
    stroke:#fff;
  }
  #circleSlow.playing svg circle.dot{
    fill:#fff;
  }
  .audio-circle svg{width:26px;height:26px;}
  .audio-label{
    font-size:11.5px;
    font-family:var(--font-mono);
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--ink-soft);
  }

  .write-input{
    width:100%;
    font-family:var(--font-body);
    font-size:17px;
    padding:14px 16px;
    border-radius:var(--radius-md);
    border:1.6px solid var(--line);
    background:#fff;
    outline:none;
    position:relative;z-index:1;
    transition:border-color .15s ease, background .15s ease;
  }
  .write-input::placeholder{color:var(--ink-faint);}
  .write-input.ok{border-color:var(--success-line); background:var(--success-soft); color:var(--success);}
  .write-input.no{border-color:var(--error-line); background:var(--error-soft); color:var(--error);}

  .btn-row{
    display:flex;gap:10px;margin-top:14px;
    position:relative;z-index:1;
  }
  .btn{
    font-family:var(--font-body);
    font-weight:600;
    font-size:14.5px;
    padding:12px 18px;
    border-radius:999px;
    border:1.6px solid var(--line);
    cursor:pointer;
    flex:1;
    text-align:center;
    transition:background .15s ease, color .15s ease, transform .1s ease;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--ink);color:#fff;}
  .btn-ghost{background:#fff;color:var(--ink);}
  .btn[disabled]{opacity:.35;cursor:default;}

  .next-row{
    margin-top:18px;
    position:relative;z-index:1;
  }

  /* ---------- Juegos: Sopa de letras ---------- */
  .word-list{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:16px;
    position:relative;z-index:1;
  }
  .word-chip{
    display:flex;
    flex-direction:column;
    border:1.4px solid var(--line);
    border-radius:var(--radius-sm);
    padding:6px 10px;
    background:#fff;
  }
  .word-chip-es{font-weight:700;font-family:var(--font-display);font-size:13px;}
  .word-chip-pt{font-size:10.5px;color:var(--ink-soft);font-style:italic;}
  .word-chip.done{border-color:var(--success-line); background:var(--success-soft);}
  .word-chip.done .word-chip-es{text-decoration:line-through; color:var(--success);}
  .word-chip.done .word-chip-pt{color:var(--success);}

  .sopa-grid{
    display:grid;
    grid-template-columns:repeat(10,1fr);
    gap:3px;
    margin:4px 0 6px;
    position:relative;z-index:1;
    user-select:none;
    -webkit-user-select:none;
  }
  .sopa-cell{
    aspect-ratio:1;
    border:1.3px solid var(--line-soft);
    border-radius:5px;
    background:#fff;
    font-family:var(--font-mono);
    font-weight:600;
    font-size:clamp(9px,3.3vw,14px);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    color:var(--ink);
    padding:0;
    line-height:1;
  }
  .sopa-cell.sel{border-color:var(--ink); background:var(--ink); color:#fff;}
  .sopa-cell.found{background:var(--success-soft); border-color:var(--success-line); color:var(--success);}

  /* ---------- Juegos: Ahorcado ---------- */
  .forca-category{
    display:block;
    text-align:center;
    font-family:var(--font-mono);
    font-size:11.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.09em;
    color:var(--ink);
    background:var(--paper);
    border:1.3px solid var(--line);
    border-radius:999px;
    padding:4px 14px;
    width:fit-content;
    margin:0 auto 8px;
    position:relative;z-index:1;
  }
  .forca-pt{
    text-align:center;
    font-style:italic;
    font-size:14px;
    color:var(--ink-soft);
    margin-bottom:14px;
    position:relative;z-index:1;
  }
  .forca-figure-wrap{
    display:flex;
    justify-content:center;
    margin-bottom:10px;
    position:relative;z-index:1;
  }
  .forca-figure{
    width:120px;
    height:auto;
  }
  .fp{
    opacity:0;
    transition:opacity .2s ease;
  }
  .fp.show{opacity:1;}
  .forca-attempts{
    text-align:center;
    font-size:12px;
    font-family:var(--font-mono);
    color:var(--ink-soft);
    margin-bottom:14px;
    position:relative;z-index:1;
  }

  .forca-word{
    display:flex;
    justify-content:center;
    gap:7px;
    flex-wrap:wrap;
    margin:6px 0 20px;
    position:relative;z-index:1;
  }
  .forca-letter{
    width:22px;
    height:34px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    font-family:var(--font-display);
    font-weight:700;
    font-size:22px;
    line-height:1;
    padding-bottom:3px;
    border-bottom:2.6px solid var(--ink);
  }

  .forca-keyboard{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    justify-content:center;
    position:relative;z-index:1;
  }
  .forca-key{
    width:29px;height:36px;
    border:1.4px solid var(--line);
    border-radius:8px;
    background:#fff;
    font-family:var(--font-body);
    font-weight:700;
    font-size:13.5px;
    cursor:pointer;
    color:var(--ink);
  }
  .forca-key[disabled]{opacity:.32; cursor:default;}
  .forca-key.wrong{background:var(--error-soft); border-color:var(--error-line); color:var(--error); opacity:1;}
  .forca-key.correct{background:var(--success-soft); border-color:var(--success-line); color:var(--success); opacity:1;}

  footer.foot{
    text-align:center;
    margin-top:26px;
    font-size:12px;
    color:var(--ink-faint);
  }

  .panel{display:none;}
  .panel.active{display:block;}

  @media (max-width:380px){
    .stage{gap:14px;}
    .mascot-box{width:96px;}
    .mic-btn{width:68px;height:68px;}
    .forca-key{width:26px;height:33px;font-size:12.5px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <div class="brand-mark"><img id="headerMascot" alt="Mascote papagaio"></div>
      <div class="brand-name">Bora hablar!</div>
    </div>
    <div class="eyebrow-global">practicar<br>español</div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" id="tabLeerBtn">Leer</button>
    <button class="tab-btn" id="tabEscribirBtn">Escribir</button>
    <button class="tab-btn" id="tabJuegosBtn">Juegos</button>
  </div>

  <!-- ================= LEER PANEL ================= -->
  <div class="panel active" id="panelLeer">
    <div class="card">
      <div class="card-row">
        <span class="eyebrow">Frase del día</span>
      </div>

      <div class="prompt-block">
        <div class="prompt-es" id="leerEs">—</div>
        <div class="prompt-pt" id="leerPt">—</div>
      </div>

      <div class="stage" style="margin-bottom:10px;">
        <div class="mascot-box" id="mascotLeerBox" style="width:92px;">
          <img id="mascotLeer" alt="Mascote">
        </div>
      </div>

      <div class="options-col" id="optionsCol"></div>

      <div class="feedback" id="leerFeedback">
        <div class="fb-head" id="leerFbHead"></div>
        <div class="fb-note" id="leerFbNote"></div>
      </div>

      <div class="next-row">
        <button class="btn btn-primary" id="leerNextBtn" style="width:100%">Próxima frase →</button>
      </div>
    </div>
  </div>

  <!-- ================= ESCRIBIR PANEL ================= -->
  <div class="panel" id="panelEscribir">
    <div class="toggle-row">
      <div class="toggle-pill">
        <button class="active" id="modeWords">Palabras</button>
        <button id="modePhrases">Frases</button>
      </div>
    </div>

    <div class="card">
      <div class="card-row">
        <span class="eyebrow" id="escEyebrow">Escucha y escribe</span>
      </div>

      <div class="audio-row">
        <button class="audio-btn" id="playNormal">
          <div class="audio-circle" id="circleNormal">
            <svg viewBox="0 0 24 24" fill="none"><path d="M4 9v6h4l5 4V5L8 9H4Z" stroke="#15161b" stroke-width="1.6" stroke-linejoin="round"/><path d="M16.5 8.5a5 5 0 0 1 0 7" stroke="#15161b" stroke-width="1.6" stroke-linecap="round"/><path d="M19 6a8.5 8.5 0 0 1 0 12" stroke="#15161b" stroke-width="1.6" stroke-linecap="round"/></svg>
          </div>
          <span class="audio-label">Escuchar</span>
        </button>
        <button class="audio-btn" id="playSlow">
          <div class="audio-circle" id="circleSlow">
            <svg viewBox="0 0 100 80" fill="none">
              <g stroke="#15161b" stroke-width="6.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M34,68 C20,68 10,60 12,49 C14,39 25,36 30,43 C34,48 32,55 25,54 C21,53.5 19,50 21,47"/>
                <path d="M34,68 C36,52 46,40 60,38 C76,36 88,45 88,56 C88,63 83,68 76,68 L34,68"/>
                <path d="M62,38 C60,30 58,25 56,22"/>
                <path d="M72,38 C73,30 74,25 75,22"/>
                <path d="M65,53 C67,55.5 70,55.5 72,53" stroke-width="4.6"/>
              </g>
              <circle class="dot" cx="55" cy="20" r="3.4" fill="#15161b" stroke="none"/>
              <circle class="dot" cx="76" cy="20" r="3.4" fill="#15161b" stroke="none"/>
              <circle class="dot" cx="63" cy="47" r="2.6" fill="#15161b" stroke="none"/>
              <circle class="dot" cx="73" cy="47" r="2.6" fill="#15161b" stroke="none"/>
            </svg>
          </div>
          <span class="audio-label">Lenta</span>
        </button>
      </div>

      <input type="text" class="write-input" id="writeInput" placeholder="Escribe aquí lo que escuchaste…" autocomplete="off" autocapitalize="off" spellcheck="false">

      <div class="btn-row">
        <button class="btn btn-ghost" id="revealBtn">Ver respuesta</button>
        <button class="btn btn-primary" id="checkBtn">Corrigir</button>
      </div>

      <div class="feedback" id="escFeedback">
        <div class="fb-head" id="escFbHead"></div>
        <div class="fb-note" id="escFbNote"></div>
      </div>

      <div class="stage" style="margin-top:10px;">
        <div class="mascot-box" id="mascotEscBox" style="width:88px;">
          <img id="mascotEsc" alt="Mascote">
        </div>
      </div>

      <div class="next-row">
        <button class="btn btn-primary" id="escNextBtn" style="width:100%">Próxima →</button>
      </div>
    </div>
  </div>

  <!-- ================= JUEGOS PANEL ================= -->
  <div class="panel" id="panelJuegos">
    <div class="toggle-row">
      <div class="toggle-pill">
        <button class="active" id="gameSopaBtn">Sopa de letras</button>
        <button id="gameForcaBtn">Ahorcado</button>
      </div>
    </div>

    <!-- Sopa de letras -->
    <div id="sopaContainer">
      <div class="card">
        <div class="card-row">
          <span class="eyebrow">Encuentra las palabras</span>
        </div>
        <div class="hint-text" id="sopaHint">Toca la primera letra y luego la última letra para formar la palabra.</div>

        <div class="word-list" id="sopaWordList"></div>
        <div class="sopa-grid" id="sopaGrid"></div>

        <div class="feedback" id="sopaFeedback">
          <div class="fb-head" id="sopaFbHead"></div>
          <div class="fb-note" id="sopaFbNote"></div>
        </div>

        <div class="stage" style="margin-top:8px;">
          <div class="mascot-box" id="mascotSopaBox" style="width:80px;">
            <img id="mascotSopa" alt="Mascote">
          </div>

/* ============================================================
   HELPERS
============================================================ */
function normalize(str){
  return str
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[¿?¡!.,;:"']/g,"")
    .replace(/\s+/g," ")
    .trim();
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

/* ============================================================
   SONIDOS DE ACIERTO / ERROR (Web Audio API)
============================================================ */
let sfxCtx = null;
function getSfxCtx(){
  if(!sfxCtx) sfxCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(sfxCtx.state === "suspended") sfxCtx.resume();
  return sfxCtx;
}
function playTone(freq, startOffset, duration, type, peakGain){
  const ctx = getSfxCtx();
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  osc.connect(g); g.connect(ctx.destination);
  const t0 = ctx.currentTime + startOffset;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(peakGain, t0 + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
  osc.start(t0);
  osc.stop(t0 + duration + 0.03);
}
function playCorrectSound(){
  try{
    playTone(659.25, 0,    0.13, "sine", 0.17); // mi
    playTone(880.00, 0.09, 0.22, "sine", 0.19); // la
  }catch(e){}
}
function playWrongSound(){
  try{
    playTone(233.08, 0,    0.16, "sine", 0.15); // si bemol
    playTone(174.61, 0.10, 0.24, "sine", 0.15); // fa
  }catch(e){}
}

function setMascot(imgEl, state){
  imgEl.src = MASCOT[state];
}

function bumpMascot(boxEl){
  boxEl.classList.remove("pop");
  void boxEl.offsetWidth;
  boxEl.classList.add("pop");
}

/* ============================================================
   SPEECH SYNTHESIS (Escribir — escuchar)
============================================================ */
let voices = [];
function loadVoices(){ voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : []; }
if(window.speechSynthesis){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}
function pickSpanishVoice(){
  const pref = voices.find(v=>/es-ES|es_ES/i.test(v.lang)) ||
               voices.find(v=>/^es/i.test(v.lang)) ||
               null;
  return pref;
}
function speak(text, rate, circleEl){
  if(!window.speechSynthesis){
    circleEl && circleEl.classList.remove("playing");
    alert("Tu navegador no soporta síntesis de voz.");
    return;
  }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "es-ES";
  const v = pickSpanishVoice();
  if(v) u.voice = v;
  u.rate = rate;
  if(circleEl){
    circleEl.classList.add("playing");
    u.onend = ()=>circleEl.classList.remove("playing");
    u.onerror = ()=>circleEl.classList.remove("playing");
  }
  window.speechSynthesis.speak(u);
}

/* ============================================================
   LEER — COMPLETAR CON 3 OPCIONES
============================================================ */
let leerIdx = 0;
const mascotLeer = document.getElementById("mascotLeer");
const mascotLeerBox = document.getElementById("mascotLeerBox");
const leerFeedback = document.getElementById("leerFeedback");
const leerFbHead = document.getElementById("leerFbHead");
const leerFbNote = document.getElementById("leerFbNote");
const optionsCol = document.getElementById("optionsCol");
const LETTERS = ["A","B","C"];

function loadLeer(){
  const item = READING_PHRASES[leerIdx];
  document.getElementById("leerEs").innerHTML = item.es.replace(item.answer, '<span class="blank">&nbsp;</span>');
  document.getElementById("leerPt").textContent = item.pt;
  leerFeedback.className = "feedback";
  setMascot(mascotLeer, "neutral");
  renderOptions(item);
}

function renderOptions(item){
  optionsCol.innerHTML = "";
  const shuffled = shuffle(item.options);
  shuffled.forEach((word, i)=>{
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.dataset.word = word;
    btn.innerHTML = `<span class="option-letter">${LETTERS[i]}</span><span>${word}</span>`;
    btn.addEventListener("click", ()=>handleOptionSelect(btn, item));
    optionsCol.appendChild(btn);
  });
}

function handleOptionSelect(selectedBtn, item){
  const buttons = optionsCol.querySelectorAll(".option-btn");
  if(buttons[0].disabled) return; // ya respondida
  const ok = selectedBtn.dataset.word === item.answer;
  buttons.forEach(b=>{
    b.disabled = true;
    if(b.dataset.word === item.answer) b.classList.add("correct");
    else if(b === selectedBtn) b.classList.add("wrong");
  });
  showLeerResult(ok, item);
}

function showLeerResult(ok, item){
  leerFeedback.className = "feedback show " + (ok?"ok":"no");
  leerFbHead.className = "fb-head " + (ok?"ok-c":"no-c");
  leerFbHead.innerHTML = (ok
    ? '<svg class="fb-mark" viewBox="0 0 24 24" fill="none"><path d="M4 12.5 9.5 18 20 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>¡Correcto!'
    : '<svg class="fb-mark" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>Sigue practicando');
  leerFbNote.textContent = item.es;
  setMascot(mascotLeer, ok?"wink":"angry");
  bumpMascot(mascotLeerBox);
  ok ? playCorrectSound() : playWrongSound();
}

document.getElementById("leerNextBtn").addEventListener("click", ()=>{
  leerIdx = (leerIdx+1) % READING_PHRASES.length;
  loadLeer();
});

/* ============================================================
   ESCRIBIR
============================================================ */
let writeMode = "words"; // words | phrases
let escIdx = 0;
const writeInput = document.getElementById("writeInput");
const escFeedback = document.getElementById("escFeedback");
const escFbHead = document.getElementById("escFbHead");
const escFbNote = document.getElementById("escFbNote");
const mascotEsc = document.getElementById("mascotEsc");
const mascotEscBox = document.getElementById("mascotEscBox");
const escEyebrow = document.getElementById("escEyebrow");

function currentWriteBank(){ return writeMode==="words" ? WRITE_WORDS : WRITE_PHRASES; }

function loadEsc(){
  const bank = currentWriteBank();
  if(escIdx>=bank.length) escIdx=0;
  writeInput.value = "";
  writeInput.className = "write-input";
  escFeedback.className = "feedback";
  setMascot(mascotEsc, "neutral");
  escEyebrow.textContent = writeMode==="words" ? "Escucha y escribe — palabra" : "Escucha y escribe — frase";

/* ============================================================
   JUEGOS — helpers compartilhados
============================================================ */
function normalizeGrid(s){
  return s.toUpperCase()
    .replace(/Ñ/g, "§")
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/§/g, "Ñ");
}
function pickWordPool(minLen, maxLen, exclude){
  return WRITE_WORDS.filter(w => !w.es.includes(" ") && w.es.length>=minLen && w.es.length<=maxLen && w.es!==exclude);
}

/* ============================================================
   JUEGOS — SOPA DE LETRAS
============================================================ */
const SOPA_SIZE = 10;
const SOPA_WORD_COUNT = 8;
const SOPA_DIRS = [[0,1],[1,0],[1,1],[1,-1]];
let sopaWords = [];
let sopaGridData = [];
let sopaFound = new Set();
let sopaSelStart = null;

function buildSopa(){
  const candidates = shuffle(pickWordPool(4, SOPA_SIZE, null));
  const grid = Array.from({length:SOPA_SIZE}, ()=>Array(SOPA_SIZE).fill(null));
  const chosen = [];

  for(const w of candidates){
    if(chosen.length >= SOPA_WORD_COUNT) break;
    const norm = normalizeGrid(w.es);
    const letters = norm.split("");
    let placed = false;
    for(let attempt=0; attempt<300 && !placed; attempt++){
      const dir = SOPA_DIRS[Math.floor(Math.random()*SOPA_DIRS.length)];
      const r = Math.floor(Math.random()*SOPA_SIZE);
      const c = Math.floor(Math.random()*SOPA_SIZE);
      const er = r + dir[0]*(letters.length-1);
      const ec = c + dir[1]*(letters.length-1);
      if(er<0||er>=SOPA_SIZE||ec<0||ec>=SOPA_SIZE) continue;
      let ok = true;
      for(let i=0;i<letters.length;i++){
        const rr=r+dir[0]*i, cc=c+dir[1]*i;
        if(grid[rr][cc]!==null && grid[rr][cc]!==letters[i]){ ok=false; break; }
      }
      if(!ok) continue;
      for(let i=0;i<letters.length;i++){
        const rr=r+dir[0]*i, cc=c+dir[1]*i;
        grid[rr][cc] = letters[i];
      }
      placed = true;
    }
    if(placed) chosen.push({es:w.es, pt:w.pt, norm});
  }

  const FILLERS = "AEIOUAEIOUAEIOULMNRSTDCPBVGHFJQZXKWYÑ".split("");
  for(let r=0;r<SOPA_SIZE;r++){
    for(let c=0;c<SOPA_SIZE;c++){
      if(grid[r][c]===null) grid[r][c] = FILLERS[Math.floor(Math.random()*FILLERS.length)];
    }
  }

  sopaWords = chosen;
  sopaGridData = grid;
  sopaFound = new Set();
  sopaSelStart = null;
  document.getElementById("sopaFeedback").className = "feedback";
  document.getElementById("sopaHint").textContent = "Toca la primera letra y luego la última letra de una palabra.";
  setMascot(document.getElementById("mascotSopa"), "neutral");
  renderSopaGrid();
  renderSopaWordList();
}

function renderSopaGrid(){
  const el = document.getElementById("sopaGrid");
  el.innerHTML = "";
  for(let r=0;r<SOPA_SIZE;r++){
    for(let c=0;c<SOPA_SIZE;c++){
      const cell = document.createElement("button");
      cell.className = "sopa-cell";
      cell.textContent = sopaGridData[r][c];
      cell.dataset.r = r; cell.dataset.c = c;
      cell.addEventListener("click", ()=>handleSopaCellClick(r,c));
      el.appendChild(cell);
    }
  }
}

function renderSopaWordList(){
  const el = document.getElementById("sopaWordList");
  el.innerHTML = "";
  sopaWords.forEach((w,idx)=>{
    const chip = document.createElement("div");
    chip.className = "word-chip";
    chip.id = "sopaChip"+idx;
    chip.innerHTML = `<span class="word-chip-es">${w.es}</span><span class="word-chip-pt">${w.pt}</span>`;
    el.appendChild(chip);
  });
}

function sopaCell(r,c){
  return document.querySelector('.sopa-cell[data-r="'+r+'"][data-c="'+c+'"]');
}

function cellsInLine(r1,c1,r2,c2){
  if(r1!==r2 && c1!==c2 && Math.abs(r2-r1)!==Math.abs(c2-c1)) return null;
  const dr = Math.sign(r2-r1), dc = Math.sign(c2-c1);
  const len = Math.max(Math.abs(r2-r1), Math.abs(c2-c1)) + 1;
  const cells = [];
  for(let i=0;i<len;i++) cells.push({r:r1+dr*i, c:c1+dc*i});
  return cells;
}

function handleSopaCellClick(r,c){
  const hint = document.getElementById("sopaHint");
  if(!sopaSelStart){
    sopaSelStart = {r,c};
    sopaCell(r,c).classList.add("sel");
    hint.textContent = "Ahora toca la última letra de la palabra…";
    return;
  }
  document.querySelectorAll(".sopa-cell.sel").forEach(el=>el.classList.remove("sel"));
  const cells = cellsInLine(sopaSelStart.r, sopaSelStart.c, r, c);
  sopaSelStart = null;
  hint.textContent = "Toca la primera letra y luego la última letra para formar la palabra.";
  if(!cells) return;

  const letters = cells.map(p=>sopaGridData[p.r][p.c]).join("");
  const reversed = letters.split("").reverse().join("");
  const matchIdx = sopaWords.findIndex((w,idx)=> !sopaFound.has(idx) && (w.norm===letters || w.norm===reversed));
  if(matchIdx<0) return;

  sopaFound.add(matchIdx);
  cells.forEach(p=>{ const el = sopaCell(p.r,p.c); if(el) el.classList.add("found"); });
  document.getElementById("sopaChip"+matchIdx).classList.add("done");
  playCorrectSound();

  if(sopaFound.size === sopaWords.length){
    const fb = document.getElementById("sopaFeedback");
    fb.className = "feedback show ok";
    document.getElementById("sopaFbHead").className = "fb-head ok-c";
    document.getElementById("sopaFbHead").innerHTML = '<svg class="fb-mark" viewBox="0 0 24 24" fill="none"><path d="M4 12.5 9.5 18 20 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>¡Completado!';
    document.getElementById("sopaFbNote").textContent = "Encontraste las " + sopaWords.length + " palabras.";
    setMascot(document.getElementById("mascotSopa"), "wink");
    bumpMascot(document.getElementById("mascotSopaBox"));
  }
}

document.getElementById("sopaNewBtn").addEventListener("click", buildSopa);

/* ============================================================
   JUEGOS — EL AHORCADO
============================================================ */
const FORCA_LIVES_MAX = 6;
const FORCA_ALPHABET = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ".split("");
const FORCA_CAT_NAMES = Object.keys(FORCA_CATEGORIES);
let forcaWord = null;
let forcaGuessed = new Set();
let forcaWrong = 0;
let forcaLastEs = null;

function buildForca(){
  const catName = FORCA_CAT_NAMES[Math.floor(Math.random()*FORCA_CAT_NAMES.length)];
  const cat = FORCA_CATEGORIES[catName];
  const candidates = cat.words.filter(w => w.es !== forcaLastEs);
  const pick = candidates[Math.floor(Math.random()*candidates.length)];
  forcaLastEs = pick.es;
  forcaWord = {es:pick.es, pt:pick.pt, norm:normalizeGrid(pick.es)};
  forcaGuessed = new Set();
  forcaWrong = 0;

  document.getElementById("forcaCategory").textContent = catName;
  document.getElementById("forcaPt").textContent = cat.q;
  document.getElementById("forcaFeedback").className = "feedback";
  setMascot(document.getElementById("mascotForca"), "neutral");
  renderForcaHangman();
  renderForcaWord();
  renderForcaKeyboard();
}

const FORCA_PARTS = ["fp1","fp2","fp3","fp4","fp5","fp6"];

function renderForcaHangman(){
  FORCA_PARTS.forEach((id, i)=>{
    document.getElementById(id).classList.toggle("show", i < forcaWrong);
  });
  document.getElementById("forcaAttempts").textContent = "Errores: " + forcaWrong + "/" + FORCA_LIVES_MAX;
}

function renderForcaWord(){
  const el = document.getElementById("forcaWord");
  el.innerHTML = "";
  forcaWord.norm.split("").forEach(ch=>{
    const div = document.createElement("div");
    div.className = "forca-letter";
    div.textContent = forcaGuessed.has(ch) ? ch : "";
    el.appendChild(div);
  });
}

function renderForcaKeyboard(){
  const el = document.getElementById("forcaKeyboard");
  el.innerHTML = "";
  FORCA_ALPHABET.forEach(letter=>{
    const btn = document.createElement("button");
    btn.className = "forca-key";
    btn.textContent = letter;
    btn.addEventListener("click", ()=>handleForcaGuess(letter, btn));
    el.appendChild(btn);
  });
}

function handleForcaGuess(letter, btnEl){
  if(forcaGuessed.has(letter)) return;
  const isCorrect = forcaWord.norm.includes(letter);
  forcaGuessed.add(letter);
  btnEl.disabled = true;
  btnEl.classList.add(isCorrect ? "correct" : "wrong");

  if(isCorrect){
    renderForcaWord();
    const done = forcaWord.norm.split("").every(ch=>forcaGuessed.has(ch));
    if(done) endForca(true);
  } else {
    forcaWrong++;
    renderForcaHangman();
    if(forcaWrong>=FORCA_LIVES_MAX) endForca(false);
  }
}

function endForca(won){
  document.querySelectorAll(".forca-key").forEach(b=>b.disabled=true);
  const fb = document.getElementById("forcaFeedback");
  fb.className = "feedback show " + (won?"ok":"no");
  document.getElementById("forcaFbHead").className = "fb-head " + (won?"ok-c":"no-c");
  document.getElementById("forcaFbHead").innerHTML = (won
    ? '<svg class="fb-mark" viewBox="0 0 24 24" fill="none"><path d="M4 12.5 9.5 18 20 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>¡Correcto!'
    : '<svg class="fb-mark" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>Sigue practicando');
  document.getElementById("forcaFbNote").textContent = "La palabra era: " + forcaWord.es + " (" + forcaWord.pt + ")";
  setMascot(document.getElementById("mascotForca"), won?"wink":"angry");
  bumpMascot(document.getElementById("mascotForcaBox"));
  won ? playCorrectSound() : playWrongSound();
}

document.getElementById("forcaNewBtn").addEventListener("click", buildForca);
